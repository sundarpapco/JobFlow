[versions]
agp= "9.2.1"
activityCompose = "1.13.0"
composeThemeAdapter = "1.2.1"
composeBom="2026.06.00"
coreKtx="1.19.0"
easyvalidationCore="1.0.4"
firebaseBom="34.16.0"
hiltAndroid="2.60.1"
hiltNavigationFragment="1.4.0"
hiltNavigationCompose = "1.3.0"
kotlin="2.4.10"
ksp="2.3.9"
googleServices="4.5.0"
navigation ="2.9.8"
navigation3 = "1.1.4"
pagingCompose = "3.3.6"
workRuntimeKtx="2.10.0"
coil="2.2.2"
algoliaClientKotlin ="3.46.0"
okHttp ="3.5.1"
espressoCore="3.6.1"
androidJunit ="1.2.1"
jUnit="4.13.2"
reorderable = "2.4.3"
kotlinxSerialization ="1.11.0"
lifecycleViewmodelNavigation3 = "2.11.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
compose-theme-adapter = { module = "com.google.android.material:compose-theme-adapter", version.ref = "composeThemeAdapter" }

#Algolia Stuff
algoliasearch-client-kotlin = { module = "com.algolia:algoliasearch-client-kotlin", version.ref = "algoliaClientKotlin" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "okHttp" }

#Fragment Navigation
androidx-navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }

#Navigation 3
androidx-navigation3 = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
androidx-navigation3-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelNavigation3" }
kotlinx-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

#Hilt
androidx-hilt-navigation-fragment = { module = "androidx.hilt:hilt-navigation-fragment", version.ref = "hiltNavigationFragment" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hiltAndroid" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hiltAndroid" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

#Reorderable LazyColumn Needed for Drag and Drop support in the machines
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }

#WorkManager
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "workRuntimeKtx" }

#Compose
compose-bom = {group="androidx.compose", name = "compose-bom", version.ref = "composeBom"}
foundation = { group="androidx.compose.foundation", name = "foundation" }
foundation-layout = { group="androidx.compose.foundation", name ="foundation-layout"}

runtime = { group="androidx.compose.runtime", name ="runtime"}
ui = { group="androidx.compose.ui", name ="ui"}
androidx-material = { group="androidx.compose.material", name ="material"}
androidx-ui-tooling = { group="androidx.compose.ui", name ="ui-tooling"}
material-icons={group="androidx.compose.material", name ="material-icons-extended"}

#Easy Validation for validation of Input fields
easyvalidation-core = { module = "com.wajahatkarim:easyvalidation-core", version.ref = "easyvalidationCore" }

#Firebase
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase",name ="firebase-auth" }
firebase-firestore = { group = "com.google.firebase", name="firebase-firestore" }
firebase-functions= { group = "com.google.firebase", name = "firebase-functions" }
firebase-storage = { group = "com.google.firebase", name = "firebase-storage" }

#Pagination
androidx-paging-common-ktx = { module = "androidx.paging:paging-common-ktx", version.ref = "pagingCompose" }
androidx-paging-compose = { module = "androidx.paging:paging-compose", version.ref = "pagingCompose" }

# Coil Image loading library to preview images from the cloud storage
coil-compose= {module = "io.coil-kt:coil-compose", version.ref="coil"}
coil= {module= "io.coil-kt:coil", version.ref="coil"}

#Test
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidJunit" }
junit = {module = "junit:junit", version.ref="jUnit"}


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
hilt-android-gradle-plugin = { id = "com.google.dagger.hilt.android", version.ref = "hiltAndroid" }
google-services ={id = 'com.google.gms.google-services', version.ref="googleServices"}
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization-plugin = {id="org.jetbrains.kotlin.plugin.serialization", version.ref="kotlin"}
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
kotlin-ksp = {id="com.google.devtools.ksp", version.ref="ksp"}
